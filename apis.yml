apis:
  - aid: clay:http-api
    name: Clay HTTP API
    description: >-
      Inbound HTTP API endpoints and per-table webhook sources that let
      external systems push JSON records into Clay tables to trigger
      enrichment, AI research, and downstream workflows, and pull or POST
      enriched data via HTTP API actions inside Clay workflows.
    humanURL: https://university.clay.com/docs/http-api-integration-overview
