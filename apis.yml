aid: clay
name: Clay
description: >-
  Clay is a go-to-market platform that combines people and company data
  enrichment from 150+ premium providers, AI research agents (Claygents),
  intent signals, and workflow automation for sales, marketing, and revenue
  operations teams. Clay exposes inbound HTTP API endpoints and webhooks so
  external systems can push records into Clay tables, trigger enrichments,
  and receive enriched data for CRM sync, lead scoring, and outbound
  workflows.
